[package]
name = "brain"
version = "0.1.0"
edition = "2024"

[dependencies]
tools = { path = "../tools" }
dotenv = "0.15"
async-trait = "0.1"
rig = "0.40.0"
rig-core = "0.40.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"


[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

